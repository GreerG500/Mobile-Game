<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Underwater Invaders - Ultimate</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #051122;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        #gameWrapper {
            position: relative;
            width: 600px;
            height: 800px;
            max-width: 100vw;
            max-height: 100vh;
        }
        canvas {
            background-color: #0a4b7c; 
            border: 4px solid #032b4d;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.4);
            touch-action: none; 
            width: 100%;
            height: 100%;
        }
        #menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.95);
            padding: 30px; border-radius: 20px;
            text-align: center; border: 2px solid #0096ff;
            z-index: 10;
            display: flex; flex-direction: column; gap: 10px;
            width: 80%;
            max-width: 400px;
        }
        h1 { margin-top: 0; margin-bottom: 5px; color: #ff8c00; }
        .sub { color: #88ccee; margin-bottom: 20px; font-size: 14px; }
        button {
            padding: 12px 20px; font-size: 16px; cursor: pointer;
            background: #0096ff; border: none; color: white; 
            border-radius: 8px; font-weight: bold; transition: 0.2s;
        }
        button:hover { background: #007acc; }
        .btn-load { background: #28a745; }
        .btn-load:hover { background: #218838; }
        
        .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        #inGameSaveBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 15px;
            background: #28a745;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
            display: none; 
            font-size: 14px;
        }
        #inGameSaveBtn:active { background: #1e7e34; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="menu">
            <h1>UNDERWATER INVADERS</h1>
            <div class="sub">Endless Edition - Auto & Manual Saves</div>
            
            <div class="btn-row">
                <button onclick="startGame('pc', false)">New Game (PC)</button>
                <button onclick="startGame('mobile', false)">New Game (Mobile)</button>
            </div>
            <div class="btn-row" style="margin-top: 10px;">
                <button class="btn-load" onclick="loadGame('pc')">Load Save (PC)</button>
                <button class="btn-load" onclick="loadGame('mobile')">Load Save (Mobile)</button>
            </div>
        </div>

        <button id="inGameSaveBtn" 
            onclick="manualSave(event)" 
            onmousedown="event.stopPropagation()" 
            ontouchstart="event.stopPropagation()">
            SAVE
        </button>

        <audio id="titleMusic" src="title music.mp3" loop></audio>

        <canvas id="gameCanvas" width="600" height="800"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const menu = document.getElementById("menu");
        const inGameSaveBtn = document.getElementById("inGameSaveBtn");
        const titleMusic = document.getElementById("titleMusic");

        // Preload Fish Animation Frames
        const fishImages = [];
        const fishFiles = ["Untitled (1).png", "Untitled (2).png", "Untitled (3).png", "Untitled (2).png"];
        fishFiles.forEach(src => {
            let img = new Image();
            img.src = src;
            fishImages.push(img);
        });

        // Preload Shark Animation Frames
        const sharkImages = [];
        const sharkFiles = ["shark left.png", "Shark right.png"];
        sharkFiles.forEach(src => {
            let img = new Image();
            img.src = src;
            sharkImages.push(img);
        });
        let sharkAnimFrame = 0;

        // Preload Background Image
        const bgImage = new Image();
        bgImage.src = "reef.jpeg";

        let gameMode = 'pc'; 
        let gameRunning = false;
        let tiltX = 0;

        let player = {};
        let level = 1;
        let state = "PLAYING";
        let frameCount = 0;
        let isShooting = false;
        let saveMessageTimer = 0; 
        const keys = {};
        
        let moveLeft = false;
        let moveRight = false;

        let enemies = [];
        let playerBullets = [];
        let enemyBullets = [];
        let drops = [];
        let boss = null;

        function resetPlayer() {
            player = {
                x: 280, y: 700, w: 40, h: 60, color: "orange",
                hp: 100, maxHp: 100, speed: 5, damage: 15, 
                fireCooldown: 25, currentCooldown: 0, projectiles: 1,
                animFrame: 0, animTimer: 0
            };
        }

        function saveGame() {
            try {
                const data = {
                    level: level, hp: player.hp, maxHp: player.maxHp, speed: player.speed,
                    damage: player.damage, fireCooldown: player.fireCooldown, projectiles: player.projectiles
                };
                localStorage.setItem('underwaterInvadersSave', JSON.stringify(data));
            } catch(e) { console.warn("Save failed", e); }
        }

        function manualSave(e) {
            e.stopPropagation(); 
            saveGame();
            saveMessageTimer = 90; 
        }

        function loadGame(mode) {
            try {
                const saved = localStorage.getItem('underwaterInvadersSave');
                if (saved) {
                    const data = JSON.parse(saved);
                    resetPlayer();
                    level = data.level;
                    player.hp = data.hp; player.maxHp = data.maxHp;
                    player.speed = data.speed; player.damage = data.damage;
                    player.fireCooldown = data.fireCooldown; player.projectiles = data.projectiles;
                    startGame(mode, true);
                    return;
                }
            } catch(e) { console.warn("Load failed", e); }
            alert("No saved game found!");
        }

        function startGame(mode, isLoad) {
            gameMode = mode;
            menu.style.display = "none";
            inGameSaveBtn.style.display = "block"; 
            gameRunning = true;
            state = "PLAYING";
            saveMessageTimer = 0;
            
            // Stop the music when the game begins
            titleMusic.pause();
            titleMusic.currentTime = 0;
            
            playerBullets = [];
            enemyBullets = [];
            drops = [];

            if (!isLoad) {
                level = 1;
                resetPlayer();
            }

            if (mode === 'mobile') requestTiltPermission();
            
            spawnLevel();
            gameLoop();
        }

        function requestTiltPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => { if (response == 'granted') window.addEventListener('deviceorientation', handleTilt); })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleTilt);
            }
        }

        function handleTilt(e) { tiltX = e.gamma; }

        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);
        canvas.addEventListener("mousedown", () => isShooting = true);
        window.addEventListener("mouseup", () => isShooting = false);

        canvas.addEventListener("touchstart", (e) => {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (gameMode === 'mobile') {
                if (x < 150) moveLeft = true;
                else if (x > 450) moveRight = true;
                else isShooting = true; 
            } else {
                isShooting = true;
            }
        });

        window.addEventListener("touchend", () => {
            isShooting = false; moveLeft = false; moveRight = false;
        });

        function spawnLevel() {
            enemies = [];
            boss = null;
            saveGame();

            if (level % 5 === 0) {
                boss = {
                    x: 260, y: 50, w: 80, h: 140, color: "darkblue",
                    maxHp: level * 40, hp: level * 40, 
                    state: "idle", timer: 180, targetX: 260
                };
            } else {
                let maxEnemies = Math.min(5 + Math.floor(level / 2), 15); 
                for (let i = 0; i < maxEnemies; i++) {
                    let row = Math.floor(i / 5);
                    let col = i % 5;
                    let enemiesInThisRow = Math.min(maxEnemies - row * 5, 5);
                    let spacing = 600 / (enemiesInThisRow + 1);
                    
                    enemies.push({
                        x: ((col + 1) * spacing) - 20, 
                        y: 60 + (row * 60) + Math.random() * 20,
                        w: 40, h: 75, color: "darkblue",
                        hp: 15 + (level * 3),
                        fireRate: Math.max(40, 150 - (level * 5)) + Math.random() * 80 
                    });
                }
            }
        }

        function update() {
            if (!gameRunning) return;
            if (state === "GAME_OVER") {
                inGameSaveBtn.style.display = "none"; 
                if (isShooting) {
                    gameRunning = false;
                    menu.style.display = "flex";
                    // Play the title music when returning to the main menu
                    titleMusic.play().catch(e => console.log("Audio autoplay blocked"));
                }
                return;
            }
            
            frameCount++;

            // Shark Animation Timer
            if (frameCount % 30 === 0) {
                sharkAnimFrame = (sharkAnimFrame + 1) % sharkImages.length;
            }

            // Player Animation Timer
            player.animTimer++;
            if (player.animTimer > 8) { 
                player.animFrame = (player.animFrame + 1) % fishImages.length;
                player.animTimer = 0;
            }

            // Movement
            if (gameMode === 'pc') {
                if ((keys["ArrowLeft"] || keys["KeyA"]) && player.x > 0) player.x -= player.speed;
                if ((keys["ArrowRight"] || keys["KeyD"]) && player.x + player.w < canvas.width) player.x += player.speed;
            } else {
                if (Math.abs(tiltX) > 2) player.x += tiltX * 0.5;
                if (moveLeft && player.x > 0) player.x -= player.speed;
                if (moveRight && player.x + player.w < canvas.width) player.x += player.speed;
                player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
            }

            // Shooting
            if (player.currentCooldown > 0) player.currentCooldown--;
            if (isShooting && player.currentCooldown <= 0) {
                player.currentCooldown = player.fireCooldown;
                let spread = 15;
                let startX = player.x + player.w / 2 - ((player.projectiles - 1) * spread) / 2;
                for(let i=0; i < player.projectiles; i++) {
                    playerBullets.push({ x: startX + (i * spread) - 4, y: player.y, w: 8, h: 12, dy: -8, color: "orange" });
                }
            }

            // Bullets collision
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                let b = playerBullets[i];
                b.y += b.dy;
                if (b.y < 0) playerBullets.splice(i, 1);
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let b = enemyBullets[i];
                b.y += 4;
                if (b.x < player.x + player.w && b.x + 12 > player.x && b.y < player.y + player.h && b.y + 12 > player.y) {
                    player.hp -= 15;
                    enemyBullets.splice(i, 1);
                    if (player.hp <= 0) state = "GAME_OVER";
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (frameCount % Math.floor(e.fireRate) === 0) enemyBullets.push({ x: e.x + e.w/2, y: e.y + e.h });
                
                for (let pbi = playerBullets.length - 1; pbi >= 0; pbi--) {
                    let pb = playerBullets[pbi];
                    if (pb.x < e.x + e.w && pb.x + pb.w > e.x && pb.y < e.y + e.h && pb.y + pb.h > e.y) {
                        e.hp -= player.damage;
                        playerBullets.splice(pbi, 1);
                    }
                }
                if (e.hp <= 0) enemies.splice(i, 1);
            }

            if (boss) {
                for (let pbi = playerBullets.length - 1; pbi >= 0; pbi--) {
                    let pb = playerBullets[pbi];
                    if (pb.x < boss.x + boss.w && pb.x + pb.w > boss.x && pb.y < boss.y + boss.h && pb.y + pb.h > boss.y) {
                        boss.hp -= player.damage;
                        playerBullets.splice(pbi, 1);
                    }
                }
                updateBoss();
                if (boss.hp <= 0) boss = null;
            }

            // Drops
            for (let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i];
                d.y += 2;
                if (player.x < d.x + d.w && player.x + player.w > d.x && player.y < d.y + d.h && player.y + player.h > d.y) {
                    if (d.type === "heart") player.hp = Math.min(player.maxHp, player.hp + 30);
                    else if (d.type === "upgrade_proj") player.projectiles++;
                    else if (d.type === "upgrade_speed") player.speed += 0.5;
                    else if (d.type === "upgrade_fire") player.fireCooldown = Math.max(10, player.fireCooldown - 2);
                    else if (d.type === "upgrade_dmg") player.damage += 5;
                    
                    drops.splice(i, 1);
                }
            }

            if (enemies.length === 0 && !boss && drops.length === 0) {
                if (playerBullets.length === 0) {
                    spawnDrops();
                    level++;
                    spawnLevel();
                }
            }
        }

        function spawnDrops() {
            drops.push({ x: 290, y: -20, w: 20, h: 20, type: "heart" });
            if (level % 5 === 0) {
                drops.push({ x: 320, y: -20, w: 20, h: 20, type: "upgrade_proj" });
            } else if (level % 2 === 0) {
                let types = ["upgrade_speed", "upgrade_fire", "upgrade_dmg"];
                let type = types[Math.floor(Math.random() * types.length)];
                drops.push({ x: 260, y: -20, w: 20, h: 20, type: type });
            }
        }

        function updateBoss() {
            if (boss.state === "idle") {
                boss.timer--;
                if (boss.timer <= 0) { boss.state = "warning"; boss.timer = 120; boss.x = Math.max(0, Math.min(canvas.width - boss.w, player.x + player.w/2 - boss.w/2)); }
            } else if (boss.state === "warning") {
                boss.timer--;
                if (boss.timer <= 0) boss.state = "dash";
            } else if (boss.state === "dash") {
                boss.y += 20;
                if (player.x < boss.x + boss.w && player.x + player.w > boss.x && player.y < boss.y + boss.h && player.y + player.h > boss.y) {
                    player.hp -= 30;
                    if (player.hp <= 0) state = "GAME_OVER";
                    boss.state = "return";
                }
                if (boss.y > canvas.height) boss.state = "return";
            } else if (boss.state === "return") {
                boss.y -= 5;
                if (boss.y <= 50) { boss.y = 50; boss.state = "idle"; boss.timer = 180; }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw the Reef Background image
            if (bgImage.complete && bgImage.naturalHeight !== 0) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                // Temporary fallback color if image takes a second to load
                ctx.fillStyle = "#0a4b7c";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            if (boss && boss.state === "warning") {
                ctx.fillStyle = "rgba(255, 0, 0, 0.2)";
                ctx.fillRect(boss.x, 0, boss.w, canvas.height);
            }

            ctx.fillStyle = "white"; ctx.font = "bold 20px Arial";
            ctx.fillText(`Wave: ${level}`, 20, 30);
            
            if (saveMessageTimer > 0) {
                saveMessageTimer--;
                ctx.fillStyle = "lime";
                ctx.font = "bold 20px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME SAVED!", canvas.width / 2, 80);
                ctx.textAlign = "left"; 
            }

            ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = "red"; ctx.fillRect(20, canvas.height - 30, 200 * (Math.max(0, player.hp) / player.maxHp), 20);
            ctx.strokeStyle = "white"; ctx.strokeRect(20, canvas.height - 30, 200, 20);
            ctx.fillStyle = "white"; ctx.font = "16px Arial"; ctx.fillText(`${Math.max(0, player.hp)} / ${player.maxHp} HP`, 230, canvas.height - 15);

            if (gameMode === 'mobile') {
                ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
                ctx.fillRect(0, 500, 150, 300); ctx.fillRect(450, 500, 150, 300); 
                ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.font="30px Arial";
                ctx.fillText("<", 60, 650); ctx.fillText(">", 510, 650);
            }

            // Draw the Animated Goldfish
            let currentFishImg = fishImages[player.animFrame];
            if (currentFishImg.complete && currentFishImg.naturalHeight !== 0) {
                ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
                ctx.drawImage(currentFishImg, player.x, player.y, player.w, player.h);
                ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
            } else {
                ctx.fillStyle = player.color; 
                ctx.fillRect(player.x, player.y, player.w, player.h);
            }

            // Draw the Animated Sharks
            let currentSharkImg = sharkImages[sharkAnimFrame];
            enemies.forEach(e => { 
                if (currentSharkImg.complete && currentSharkImg.naturalHeight !== 0) {
                    ctx.save();
                    ctx.translate(e.x + e.w/2, e.y + e.h/2);
                    ctx.rotate(Math.PI); 
                    ctx.drawImage(currentSharkImg, -e.w/2, -e.h/2, e.w, e.h);
                    ctx.restore();
                } else {
                    ctx.fillStyle = e.color; ctx.fillRect(e.x, e.y, e.w, e.h); 
                }
            });
            
            // Draw the Boss 
            if (boss) { 
                if (currentSharkImg.complete && currentSharkImg.naturalHeight !== 0) {
                    ctx.save();
                    ctx.translate(boss.x + boss.w/2, boss.y + boss.h/2);
                    ctx.rotate(Math.PI); 
                    ctx.drawImage(currentSharkImg, -boss.w/2, -boss.h/2, boss.w, boss.h);
                    ctx.restore();
                } else {
                    ctx.fillStyle = boss.color; ctx.fillRect(boss.x, boss.y, boss.w, boss.h); 
                }
                ctx.fillStyle = "red"; ctx.fillRect(150, 10, 300 * (boss.hp / boss.maxHp), 10);
                ctx.strokeStyle = "white"; ctx.strokeRect(150, 10, 300, 10);
            }
            
            playerBullets.forEach(b => { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); });
            enemyBullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2);
                ctx.fillStyle = "lightblue"; ctx.fill(); ctx.strokeStyle="white"; ctx.lineWidth=1; ctx.stroke();
            });
            
            drops.forEach(d => { 
                if (d.type === "heart") ctx.fillStyle = "red";
                else if (d.type === "upgrade_proj") ctx.fillStyle = "gold";
                else ctx.fillStyle = "cyan"; 
                ctx.fillRect(d.x, d.y, d.w, d.h); 
            });

            if (state === "GAME_OVER") {
                ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "red"; ctx.font = "bold 40px Arial"; ctx.textAlign = "center";
                ctx.fillText("FISH FOOD!", canvas.width/2, canvas.height/2 - 40);
                ctx.fillStyle = "white"; ctx.font = "20px Arial";
                ctx.fillText(`You survived to Wave ${level}`, canvas.width/2, canvas.height/2 + 10);
                ctx.fillStyle = "#ff8c00"; ctx.font = "16px Arial";
                ctx.fillText("(Click or Tap anywhere to return to Menu)", canvas.width/2, canvas.height/2 + 60);
                ctx.textAlign = "left"; 
            }
        }

        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        // Try to start title music automatically when the user interacts with the page for the first time
        window.addEventListener('click', () => {
            if (!gameRunning && state !== "GAME_OVER") {
                titleMusic.play().catch(e => console.log("Waiting for user interaction to play music."));
            }
        }, { once: true });

    </script>
</body>
</html>
